server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. BANKA SERVİSİ
        - id: bank-service
          uri: lb://bank-service
          predicates:
            - Path=/api/v1/customers/**,/api/v1/accounts/**,/api/v1/cards/**,/api/v1/transactions/**,/api/v1/auth/**
          filters:
            - AuthenticationFilter # <-- EKLENDİ

        # 2. E-TİCARET SERVİSİ
        - id: ecommerce-service
          uri: lb://ecommerce-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/carts/**,/api/v1/checkout/**
          filters:
            - AuthenticationFilter # <-- EKLENDİ

        # 3. POS SERVİSİ
        - id: pos-service
          uri: lb://pos-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/settlements/**
          filters:
            - AuthenticationFilter # <-- EKLENDİ

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: "sanal-pos-projesi-icin-cok-gizli-bir-anahtar-bu-en-az-256-bit-olmali"