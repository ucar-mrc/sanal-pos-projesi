server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 1. BANKA SERVİSİ
            - id: bank-service
              uri: lb://bank-service
              predicates:
                - Path=/api/v1/customers/**,/api/v1/accounts/**,/api/v1/cards/**,/api/v1/transactions/**

            # 2. E-TİCARET SERVİSİ
            - id: ecommerce-service
              uri: lb://ecommerce-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/carts/**,/api/v1/checkout/**

            # 3. POS SERVİSİ
            - id: pos-service
              uri: lb://pos-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/settlements/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true