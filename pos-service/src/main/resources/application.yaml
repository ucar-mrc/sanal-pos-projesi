server:
  port: 8082

spring:
  application:
    name: pos-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: sanalpos
    password: sanalpos123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Feign için ortak timeout ayarları (Hafta 5'te detay)
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000