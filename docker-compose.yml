services:
  postgres:
    image: postgres:16-alpine
    container_name: sanalpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: sanalpos
      POSTGRES_PASSWORD: sanalpos123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanalpos -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: